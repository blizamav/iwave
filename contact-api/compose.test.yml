# Proyecto aislado. No usa ni modifica los contenedores publicados.
name: iwave-form027-test
services:
  contact-api:
    build: .
    env_file: ../.env
    # Sobrescribir solo ajustes locales; conservar .env privado sin modificaciones.
    environment:
      CONTACT_MAIL_PROVIDER: zoho
      PORT: "3000"
      CONTACT_BIND: 0.0.0.0
      CONTACT_DB_PATH: /data/contact.sqlite
      CONTACT_ALLOWED_ORIGINS: http://localhost:8127
      TURNSTILE_HOSTNAMES: localhost
      CONTACT_TRUSTED_PROXY_IPS: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3027:3000"
    volumes:
      - contact-state:/data
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8127:80"
    volumes:
      - ../index.html:/usr/share/nginx/html/index.html:ro
      - ../styles.css:/usr/share/nginx/html/styles.css:ro
      - ../script.js:/usr/share/nginx/html/script.js:ro
      - ../img:/usr/share/nginx/html/img:ro
      - ./nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      contact-api:
        condition: service_healthy
volumes:
  contact-state:
