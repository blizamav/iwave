# Preparación solamente. No ejecutar up/build sin autorización de despliegue.
name: iwave-form027-prod
services:
  iwave-form027-api:
    image: ${FORM027_API_IMAGE:?Definir imagen API con etiqueta inmutable}
    build:
      context: .
    env_file: ../.env.form027-production
    environment:
      CONTACT_MAIL_PROVIDER: zoho
      PORT: "3000"
      CONTACT_BIND: 0.0.0.0
      CONTACT_DB_PATH: /data/contact.sqlite
      CONTACT_ALLOWED_ORIGINS: https://iwave.cl,https://www.iwave.cl
      TURNSTILE_HOSTNAMES: iwave.cl,www.iwave.cl
      # Límite compartido conservador hasta fijar la IP del proxy por separado.
      CONTACT_TRUSTED_PROXY_IPS: ""
    restart: unless-stopped
    networks: [iwave-web]
    volumes:
      - contact-state:/data
    read_only: true
    tmpfs: [/tmp:size=8m,noexec,nosuid]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  iwave-form027-web:
    image: ${FORM027_WEB_IMAGE:?Definir imagen web con etiqueta inmutable}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        IWAVE_REVISION: ${FORM027_REVISION:?Definir revision aprobada}
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    user: "101:101"
    restart: unless-stopped
    networks: [iwave-web]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,uid=101,gid=101
      - /var/run:size=1m,noexec,nosuid,uid=101,gid=101
      - /tmp:size=8m,noexec,nosuid,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  iwave-web:
    external: true
    name: iwave-web
volumes:
  contact-state:
