# Añadir al Advanced del Proxy Host existente de iwave.cl; no crear Custom Locations duplicadas.
# Mantener SSL, dominios, redirecciones y demás directivas vigentes.
location = /api/contact {
    access_log off;
    client_max_body_size 16k;
    proxy_pass http://iwave-form027-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Contact-Client-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
}
location = /api/contact/config {
    access_log off;
    proxy_pass http://iwave-form027-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
